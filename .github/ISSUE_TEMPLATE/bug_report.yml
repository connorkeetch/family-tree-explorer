name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: markdown
    attributes:
      value: "Do not attach real GEDCOMs, databases, backups, credentials, or identifiable family information. Public issues are visible to everyone."
  - type: input
    id: version
    attributes:
      label: App release or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and installation method
      placeholder: "Windows 11, Docker Compose"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Can you reproduce this with the fictional example tree?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant error or screenshot
      description: Review and remove private information before posting.
